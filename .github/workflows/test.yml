name: test

# Shell-level tests of the save action (CIRISCache#3): the LRU prune under
# the step's exact shell options, and every failure path of the push step
# with a stub oras. No registry, no token — runs on every PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prune_test
        run: bash tests/prune_test.sh
      - name: save_step_test
        run: bash tests/save_step_test.sh
