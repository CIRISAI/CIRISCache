name: "CIRISCache save"
description: "Save a CI build cache to a GHCR package (ORAS push of a tarball)."

inputs:
  package:
    description: "GHCR package reference without the tag (lowercase)."
    default: "ghcr.io/cirisai/ciriscache"
  key:
    description: "Explicit cache key (OCI tag). Must match what `restore` will use. Empty → auto-derive (per repo)."
    default: ""
  alias-keys:
    description: >
      Extra OCI tags to point at the SAME manifest this save pushes, space/
      newline-separated. Applied as a registry-side `oras tag` of the pushed
      digest — NO second tar/gzip/upload. Use when one build's target/ must be
      reachable under several keys (e.g. a versioned exact-pin AND a rolling
      `phead`): push the blob once, alias the rest. Replaces the N-full-saves-of-
      identical-content pattern (CIRISPersist#458 — the double ~9-min save was
      two tar+push cycles of byte-identical target/). A retag failure is
      non-fatal (logged as a warning); the primary save still counts.
    default: ""
  lockfiles:
    description: "Space-separated files hashed into the auto key (when `key` is empty)."
    default: "Cargo.lock"
  prefix-key:
    description: "Key namespace; bump to invalidate everything at once."
    default: "v1"
  paths:
    description: "Space-separated dirs to cache. `~` and workspace-relative paths are expanded."
    default: "~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db target"
  max-size-mb:
    description: >
      Optional target/-size budget in MB. When set (and GNU find is
      available — i.e. the Linux lanes, where the fat-blob pain lives), the
      save prunes the OLDEST-mtime files under target/ until the total is
      within budget BEFORE tarring. This breaks the cache RATCHET
      (restore(fat) -> build -> save(fat+)): stale artifact generations —
      e.g. an entire superseded dependency-version set after a re-pin —
      are restored, never rebuilt, and re-saved forever, growing the blob
      and every download+extract on every lane. LRU-by-mtime means a
      reused-but-ancient artifact may take ONE forced recompile and then
      re-enters with a fresh mtime — mild steady-state churn in exchange
      for a bounded blob. Empty (default) = disabled. Never touches
      ~/.cargo (registry/git are lockfile-keyed, not generational).
    default: ""
  token:
    description: >
      GHCR token with write:packages. Pass the job's GITHUB_TOKEN (the
      secrets.GITHUB_TOKEN value) from a job with `permissions: packages: write`
      — the repo must be granted write access to the package once (see
      docs/DESIGN.md). No PAT / org secret required.
    required: true

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v1
    - id: k
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.key }}" ]; then
          KEY="${{ inputs.key }}"
        else
          RUSTV=$(rustc -vV 2>/dev/null | sha256sum | cut -c1-12 || echo norustc)
          LOCKH=$( (cat ${{ inputs.lockfiles }} 2>/dev/null || true) | sha256sum | cut -c1-16)
          KEY="${{ inputs.prefix-key }}-${{ runner.os }}-${{ runner.arch }}-${RUSTV}-${LOCKH}"
        fi
        KEY=$(printf '%s' "$KEY" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-' | cut -c1-128)
        echo "key=$KEY" >> "$GITHUB_OUTPUT"
        echo "ref=${{ inputs.package }}:$KEY" >> "$GITHUB_OUTPUT"
        echo "CIRISCache key: $KEY"
    - id: push
      shell: bash
      env:
        CIRISCACHE_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # Portable step-internal timeout (CIRISPersist#458 — fail-open save). A
        # HUNG `oras push`/`oras tag` (dead GHCR / stalled upload) would otherwise
        # freeze the step until the JOB timeout, delaying (and on a tag run,
        # orphaning) the release. `timeout(1)` isn't portable (absent on macOS
        # runners; Windows `timeout.exe` differs), so use a bash watchdog: run in
        # the background, SIGTERM after N seconds, return the real rc (124 on
        # watchdog fire). The caller wraps save in `continue-on-error: true`, so a
        # timed-out push is non-fatal. Watchdog stdout → /dev/null so it can't
        # hold a `$(…)` capture pipe open.
        _cc_timeout() {
          local secs="$1"; shift
          "$@" &
          local cmdpid=$!
          ( sleep "$secs"; kill -TERM "$cmdpid" 2>/dev/null ) >/dev/null 2>&1 &
          local wdpid=$!
          local rc=0
          wait "$cmdpid" 2>/dev/null || rc=$?
          kill -TERM "$wdpid" 2>/dev/null
          wait "$wdpid" 2>/dev/null || true
          [ "$rc" -ge 128 ] && return 124
          return "$rc"
        }
        REF="${{ steps.k.outputs.ref }}"
        printf '%s' "${CIRISCACHE_TOKEN}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
        EXP=""
        for p in ${{ inputs.paths }}; do
          p="${p/#\~/$HOME}"
          case "$p" in /*) ;; *) p="$GITHUB_WORKSPACE/$p";; esac
          # Windows MSYS tar: normalize D:\a\... -> /d/a/... so there's no
          # drive-letter colon (GNU tar reads "D:" as a remote rsh host —
          # "Cannot connect to D:") and no backslashes. --force-local alone only
          # covers the -f archive name, NOT the member operands, so it is not
          # enough; cygpath the members too. macOS BSD tar has neither the flag
          # nor the bug, so leave its paths untouched.
          [ "${RUNNER_OS:-}" = "Windows" ] && p="$(cygpath -u "$p")"
          if [ -e "$p" ]; then EXP="$EXP $p"; else echo "CIRISCache: skip missing $p"; fi
        done
        if [ -z "$EXP" ]; then echo "CIRISCache: nothing to cache"; exit 0; fi
        # -P keeps absolute paths so restore lands them back in place. On Windows
        # use a POSIX archive path + --force-local (belt-and-suspenders); members
        # are already cygpath'd above. oras is a native Windows binary, so it gets
        # the unconverted RUNNER_TEMP (cd "$TMP" lands in the same physical dir).
        TMP="${RUNNER_TEMP}"; FL=""
        if [ "${RUNNER_OS:-}" = "Windows" ]; then TMP="$(cygpath -u "${RUNNER_TEMP}")"; FL="--force-local"; fi
        # ── LRU prune (see max-size-mb input) ─────────────────────────────
        if [ -n "${{ inputs.max-size-mb }}" ] && [ -d "$GITHUB_WORKSPACE/target" ] \
           && find --version >/dev/null 2>&1; then
          BUDGET_KB=$(( ${{ inputs.max-size-mb }} * 1024 ))
          T="$GITHUB_WORKSPACE/target"
          USED_KB=$(du -sk "$T" | cut -f1)
          if [ "$USED_KB" -gt "$BUDGET_KB" ]; then
            echo "CIRISCache: target/ ${USED_KB}KB over ${BUDGET_KB}KB budget — LRU prune"
            # Oldest-mtime first; delete until within budget. %T@ (GNU find)
            # + a size column so we can stop exactly at the line.
            find "$T" -type f -printf '%T@ %k %p\n' 2>/dev/null | sort -n | \
            while read -r _mt kb path; do
              [ "$USED_KB" -le "$BUDGET_KB" ] && break
              rm -f -- "$path" 2>/dev/null || continue
              USED_KB=$(( USED_KB - kb ))
            done
            # The subshell above cannot export USED_KB; re-measure honestly.
            AFTER_KB=$(du -sk "$T" | cut -f1)
            echo "CIRISCache: pruned target/ ${USED_KB}KB→${AFTER_KB}KB (budget ${BUDGET_KB}KB)"
          else
            echo "CIRISCache: target/ ${USED_KB}KB within ${BUDGET_KB}KB budget — no prune"
          fi
        elif [ -n "${{ inputs.max-size-mb }}" ]; then
          echo "CIRISCache: max-size-mb set but GNU find unavailable — prune skipped (fail-open)"
        fi
        tar $FL -czPf "$TMP/cache.tar.gz" $EXP
        cd "$TMP"
        _cc_timeout 1200 oras push "$REF" cache.tar.gz:application/gzip
        echo "CIRISCache: saved $REF ($(du -h cache.tar.gz | cut -f1))"
        # Registry-side retag: point each alias key at the SAME manifest we just
        # pushed — no re-tar / re-gzip / re-upload of the (byte-identical)
        # target/. `oras tag` adds tags to the existing remote digest server-side
        # (~1s), moving the tag if it already exists (correct for a rolling
        # `phead`). CIRISPersist#458: the double ~9-min save was two full
        # tar+push cycles of identical content; this collapses it to push-once +
        # alias. A retag failure is non-fatal — the primary $REF is already saved.
        PKG="${REF%:*}"
        for ALIAS in ${{ inputs.alias-keys }}; do
          ALIAS=$(printf '%s' "$ALIAS" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-' | cut -c1-128)
          [ -z "$ALIAS" ] && continue
          if _cc_timeout 60 oras tag "$REF" "$ALIAS"; then
            echo "CIRISCache: aliased ${PKG}:${ALIAS} → same manifest as $REF (no re-upload)"
          else
            echo "::warning::CIRISCache: alias retag failed for ${PKG}:${ALIAS} (non-fatal; primary save intact)"
          fi
        done
